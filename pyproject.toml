[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-test-agent"
version = "0.1.0"
description = "接口自动化测试 Agent:扫描接口 → 生成用例(人工评审)→ 生成 pytest 工程 → 自测修复 → Allure 报告"
requires-python = ">=3.11"
dependencies = [
    "pi-coding-agent-python-sdk>=0.4.3",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-json-report>=1.5", "allure-pytest>=2.13"]

[project.scripts]
api-test-agent = "api_test_agent.cli:main"

[tool.setuptools.packages.find]
include = ["api_test_agent*"]

[tool.setuptools.package-data]
api_test_agent = ["skills/*/SKILL.md"]
