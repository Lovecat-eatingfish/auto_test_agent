# 服务端口
server.port=38000

# Tomcat 线程池（默认值，写出来方便压测时调整对比）
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# ---- SQLite 数据源（替代 MySQL）----
# 库文件相对启动目录生成，建议统一从 jmeter-demo 目录启动；
# 删掉 data/demo.db 即可完全重置数据
spring.datasource.url=jdbc:sqlite:./data/demo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 写并发会抛 SQLITE_BUSY，靠 busy_timeout 让写请求排队等锁而不是直接失败
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout = 10000
# SQLite 同一时刻只允许一个写连接，池子太大只会加剧锁竞争
spring.datasource.hikari.maximum-pool-size=10

# 启动时执行 schema.sql（建表语句是 CREATE TABLE IF NOT EXISTS，可重复启动）
spring.sql.init.mode=always

# ---- JWT ----
# HS256 密钥，至少 32 字节；演示用固定值，生产应放环境变量/配置中心
jwt.secret=jmeter-demo-dev-secret-0123456789abcdef-0123456789abcdef
# token 有效期（分钟）；压测时注意别让 token 中途过期
jwt.expire-minutes=120
